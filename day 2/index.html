<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Capture ideas before they disapear.</p>

         <nav>
           <a href="about.html">About</a>
           <a href="index.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Add a note</h2>
            <form id="note-form">
                <label for="note-input">New note</label>
                <input type="text" id="note-input" placeholder="Type a note..."/>
                <button type="submit">Add Note</button>
            </form>
        </section>

        <section>
            <h2>Your notes</h2>
            <div>
            <p id="note-count">You have 2 notes.</p>
            <ul id="notes-list">
                <li>Revise HTML forms</li>
                <li>Push my code to GitHub</li>
            </ul>
            </div>
            </section>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
</body>
</html>
